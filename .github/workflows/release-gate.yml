# Release gate for plebumbtc.io.
# Build, independently verify, and deploy exactly the verified dist/site tree.
# Pages deployment only runs on pushes to main after all release checks pass.
name: Release gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate-prestamp:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          python3 -m pip install --quiet "reportlab==4.2.5" "pypdf==5.9.0"

      - name: Regenerate pre-stamp PDFs
        run: |
          python3 scripts/regenerate-prestamp-pdfs.py --out /tmp/prestamp
          ls -lh /tmp/prestamp/*.pdf | head -20

      - name: Upload prestamp PDFs
        uses: actions/upload-artifact@v4
        with:
          name: prestamp-pdfs-${{ github.sha }}
          path: /tmp/prestamp/*.pdf
          retention-days: 7

  release-gate:
    runs-on: ubuntu-24.04
    needs: regenerate-prestamp
    steps:
      - name: Check out exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Record commit SHA
        id: sha
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git status --porcelain && echo "TREE CLEAN" || echo "TREE DIRTY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install PDF deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          python3 -m pip install --quiet "reportlab==4.2.5" "pypdf==5.9.0" "numpy==1.26.4" "zxing-cpp==2.1.0" "Pillow==10.4.0"

      - name: Run release pipeline (production)
        run: |
          python3 scripts/release.py \
            --production \
            --commit "${{ steps.sha.outputs.sha }}" \
            --out dist

      - name: Download prestamp PDFs
        uses: actions/download-artifact@v4
        with:
          name: prestamp-pdfs-${{ github.sha }}
          path: /tmp/prestamp

      - name: Run independent verifier (production, with provenance)
        run: |
          python3 scripts/verify_release.py \
            --production \
            --dist dist \
            --repo "$GITHUB_WORKSPACE" \
            --prestamp-dir /tmp/prestamp

      - name: Run negative/mutation tests
        run: |
          python3 scripts/test-release-gate.py \
            --production \
            --dist dist \
            --repo "$GITHUB_WORKSPACE" \
            --prestamp-dir /tmp/prestamp

      - name: Upload verification report (diagnostic)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-dist-${{ steps.sha.outputs.sha }}
          path: |
            dist/
          retention-days: 30

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report-${{ steps.sha.outputs.sha }}
          path: |
            dist/release-manifest.json
          retention-days: 90

      # The maintainer has temporarily retired production in favor of staging.
      # Preserve all required release checks, then validate the redirect-only artifact.
      - name: Build and verify temporary redirect-only site
        run: python3 scripts/build_redirect.py

      - name: Upload temporary redirect site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/redirect-site

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: release-gate
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy temporary redirect site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
