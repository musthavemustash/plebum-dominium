# Temporary production retirement requested by the maintainer.
# The preceding release workflow remains recoverable in Git history.
name: Redirect production to test site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  redirect-site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and verify redirect-only artifact
        run: python3 scripts/build_redirect.py
      - name: Upload redirect site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/redirect-site
  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: redirect-site
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy redirect-only site
        id: deployment
        uses: actions/deploy-pages@v4
