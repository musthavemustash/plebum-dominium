# Release gate for plebumbtc.io.
#
# Runs the deterministic release pipeline (scripts/release.py) on the exact
# event commit, then the independent fail-closed verifier
# (scripts/verify_release.py), including negative/mutation tests that prove
# the gate rejects bad releases.
#
# Provenance (Option A): A separate job independently regenerates pre-stamp
# PDFs from source. The verifier hashes those regenerated PDFs itself
# (not trusting any hash value) and compares against the manifest's
# content_sha256. This proves the manifest hashes match independently
# generated bytes.
#
# IMPORTANT: This workflow alone does not block direct pushes. The maintainer
# must enable branch protection on `main` requiring the `release-gate`
# status check before merging. Without branch protection, a direct push
# bypasses this gate.
#
# NOTE: This file cannot be pushed via the GitHub API connector used by the
# coding agent (403 on .github/workflows/*). The maintainer must add it via
# the GitHub web UI or a local git push.

name: Release gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Job 1: Independently regenerate pre-stamp PDFs from source.
  # The verifier (Job 2) will hash these itself and compare to the manifest.
  regenerate-prestamp:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          python3 -m pip install --quiet "reportlab==4.2.5" "pypdf==5.9.0"

      - name: Regenerate pre-stamp PDFs
        run: |
          python3 scripts/regenerate-prestamp-pdfs.py --out /tmp/prestamp
          ls -lh /tmp/prestamp/*.pdf | head -20

      - name: Upload prestamp PDFs
        uses: actions/upload-artifact@v4
        with:
          name: prestamp-pdfs-${{ github.sha }}
          path: /tmp/prestamp/*.pdf
          retention-days: 7

  release-gate:
    runs-on: ubuntu-24.04
    needs: regenerate-prestamp
    steps:
      - name: Check out exact event commit
        uses: actions/checkout@v4
        with:
          # The SHA being tested, not a mutable branch ref
          ref: ${{ github.sha }}

      - name: Record commit SHA
        id: sha
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git status --porcelain && echo "TREE CLEAN" || echo "TREE DIRTY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install PDF deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          python3 -m pip install --quiet "reportlab==4.2.5" "pypdf==5.9.0" "numpy==1.26.4" "zxing-cpp==2.1.0" "Pillow==10.4.0"

      - name: Run release pipeline (production)
        run: |
          python3 scripts/release.py \
            --production \
            --commit "${{ steps.sha.outputs.sha }}" \
            --out dist
        # Production mode: never --skip-pdfs. The production verifier
        # rejects UNVERIFIED content hashes.

      - name: Download prestamp PDFs
        uses: actions/download-artifact@v4
        with:
          name: prestamp-pdfs-${{ github.sha }}
          path: /tmp/prestamp

      - name: Run independent verifier (production, with provenance)
        run: |
          python3 scripts/verify_release.py \
            --production \
            --dist dist \
            --repo "$GITHUB_WORKSPACE" \
            --prestamp-dir /tmp/prestamp

      - name: Run negative/mutation tests
        run: |
          python3 scripts/test-release-gate.py \
            --production \
            --dist dist \
            --repo "$GITHUB_WORKSPACE" \
            --prestamp-dir /tmp/prestamp

      - name: Upload verification report (diagnostic)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-dist-${{ steps.sha.outputs.sha }}
          path: |
            dist/
          retention-days: 30

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report-${{ steps.sha.outputs.sha }}
          path: |
            dist/release-manifest.json
          retention-days: 90
          
