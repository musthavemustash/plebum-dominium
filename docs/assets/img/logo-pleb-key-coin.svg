  <!-- key held upright -->
  <g stroke="#2a1810" stroke-linecap="round" fill="none">
    <circle cx="82" cy="34" r="8" stroke-width="4.5"/>
    <line x1="79" y1="41" x2="70" y2="66" stroke-width="4.5"/>
    <line x1="74" y1="56" x2="83" y2="60" stroke-width="4.5"/>
    <line x1="70" y1="66" x2="79" y2="69" stroke-width="4.5"/>
  </g>
</svg>
