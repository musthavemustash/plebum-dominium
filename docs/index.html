<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plebum Dominium · Maintenance</title>
<style>
  :root { --bg:#0e0d0b; --fg:#efe9dc; --muted:#9b9384; --accent:#c4a484; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--fg); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { max-width:500px; text-align:center; }
  h1 { font-size:2rem; margin-bottom:1rem; color:var(--accent); }
  p { color:var(--muted); line-height:1.6; margin-bottom:1rem; }
  .logo { font-size:3rem; margin-bottom:1rem; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">⚙️</div>
  <h1>Under Maintenance</h1>
  <p>Plebum Dominium is temporarily offline for updates.</p>
  <p>Please check back soon.</p>
  <p>be back soon</p>
</div>
</body>
</html>
