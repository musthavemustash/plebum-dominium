<section class="path-toggle" id="path-toggle">
<h2>Trade trust for difficulty</h2>
<p>Pick the trade before you start. The card below changes with the switch, and the start line tells you where to go first.</p>
<div class="path-seg" role="group" aria-label="Choose a setup">
<button type="button" data-path="easy" aria-pressed="false">One device</button>
<button type="button" data-path="one" aria-pressed="false">One key and a passphrase</button>
<button type="button" data-path="full" aria-pressed="true">Three keys</button>
</div>
<div class="path-ends"><span>&larr; Less work, more trust</span><span>More work, less trust &rarr;</span></div>
<div id="path-card-home" class="path-card path-card-full"></div>
<p>The easier option is written out in full on the <a href="{BASE}path-risks.html">Risks of your path</a> page.</p>
</section>
<script>
(function () {
  var PATHS = {
    easy: { cls: "path-card-easy", sel: "sel-easy", title: "Words into one trusted device", trade: "Trust: one device and its maker. Work: lowest.", start: "Start: roll dice, stamp titanium, enter the words on the device.", steps: ["Roll dice for 24 words.", "Stamp the words in titanium first.", "Enter the words on the hardware wallet itself."], risk: "Risk: one device, one maker. If either fails you, the wallet fails.", go: "{BASE}handouts/dice.html", goText: "Start with the dice sheet" },
    one: { cls: "path-card-one", sel: "sel-one", title: "One key and a passphrase", trade: "Trust: one key, one device, one passphrase. Work: medium.", start: "Start: the single-sig sheet.", steps: ["Roll dice for 24 words.", "Add a passphrase, kept on paper apart from the plate.", "Stamp the words in titanium. Use a watch-only wallet."], risk: "Risk: one key and one passphrase. Lose the passphrase and the wallet is gone.", go: "{BASE}handouts/single-sig.html", goText: "Start with the single-sig sheet" },
    full: { cls: "path-card-full", sel: "sel-full", title: "Three keys, three places", trade: "Trust: no single key, device, or place. Work: highest.", start: "Start at the beginning. Work the steps.", steps: ["Roll three dice keys. Stamp three titanium plates. Keep them in three places.", "Build the 2-of-3. Practice spend first. Hide the encrypted map."], risk: "Risk: the most steps to get right. Lose two keys and the map and the funds are locked.", go: "{BASE}handouts/threat-model.html", goText: "Start with Before you begin" }
  };
  var card = document.getElementById("path-card-home");
  var buttons = document.querySelectorAll("#path-toggle .path-seg button");
  function show(path) {
    var p = PATHS[path];
    card.className = "path-card " + p.cls;
    var html = "<h3>" + p.title + "</h3><p class=\"path-trade\">" + p.trade + "</p><p><strong>" + p.start + "</strong></p><ul>";
    p.steps.forEach(function (s) { html += "<li>" + s + "</li>"; });
    html += "</ul><p><strong>" + p.risk + "</strong></p><p><a class=\"path-go\" href=\"" + p.go + "\">" + p.goText + " &rarr;</a></p>";
    card.innerHTML = html;
    buttons.forEach(function (b) {
      var on = b.getAttribute("data-path") === path;
      b.setAttribute("aria-pressed", on ? "true" : "false");
      b.className = on ? PATHS[b.getAttribute("data-path")].sel : "";
    });
  }
  buttons.forEach(function (b) { b.addEventListener("click", function () { var p = b.getAttribute("data-path"); show(p); try { localStorage.setItem("pd-path", p); } catch (e) {} if (window.pdSetPath) window.pdSetPath(p); }); });
  var saved = null;
  try { saved = localStorage.getItem("pd-path"); } catch (e) {}
  show(saved === "easy" || saved === "one" || saved === "full" ? saved : "full");
})();
</script>
