        <text x="24" y="356" fill="#9b9384" font-size="14">Two tools must agree</text>
        <text x="176" y="396" fill="#c4a484" font-size="16" text-anchor="middle">↓</text>
        <rect x="8" y="404" width="344" height="96" rx="10" fill="#161411" stroke="#2a2722"/>
        <text x="24" y="434" fill="#c4a484" font-size="11" letter-spacing="2">4 · RESTORE ON THE DEVICE</text>
        <text x="24" y="462" fill="#efe9dc" font-size="17">Every word entered on</text>
        <text x="24" y="484" fill="#efe9dc" font-size="17">the device itself</text>
      </svg>